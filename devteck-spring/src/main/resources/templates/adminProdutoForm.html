<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DevTeck - Formulário de Produto</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: admin}"></div>

    <div class="container page-content">
        <h1 style="text-align: center;" th:text="${produtoId} != null ? 'Editar Produto' : 'Novo Produto'">Formulário de Produto</h1>

        <div class="card form-card" style="padding: 5rem; margin: 0 auto;">
            <form th:action="${produtoId} != null ? @{'/admin/produtos/' + ${produtoId}} : @{/admin/produtos}"
                  th:object="${produtoRequest}" method="post">

                <div class="field">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" th:field="*{nome}" required>
                </div>

                <div class="field">
                    <label for="categoria">Categoria</label>
                    <input type="text" id="categoria" th:field="*{categoria}" required>
                </div>

                <div class="field">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" step="0.01" min="0" id="preco" th:field="*{preco}" required>
                </div>

                <div class="field">
                    <label for="quantidadeEstoque">Quantidade em Estoque</label>
                    <input type="number" min="0" id="quantidadeEstoque" th:field="*{quantidadeEstoque}" required>
                </div>

                <div class="field">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" th:field="*{descricao}"></textarea>
                </div>

                <div class="field">
                    <label for="imagem">URL da Imagem</label>
                    <input type="text" id="imagem" th:field="*{imagem}" placeholder="https://...">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn">Salvar Produto</button>
                    <a th:href="@{/admin/produtos}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
